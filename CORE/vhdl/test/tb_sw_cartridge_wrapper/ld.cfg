# This is the layout for a CRT file with two 16k CHIPs
MEMORY
{
   CRT_HEADER:
      start 0
      size  $40
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM0_HEADER:
      start 0
      size  $10
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM0_LO:
      start $8000
      size  $2000
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM0_HI:
      start $E000
      size  $2000
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM1_HEADER:
      start 0
      size  $10
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM1_LO:
      start $8000
      size  $2000
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM1_HI:
      start $E000
      size  $2000
      type  ro
      fill  yes
      file  "snappy.crt";
}

SEGMENTS
{
   CRT_HEADER:
      load  CRT_HEADER
      type  ro;

   ROM0_HEADER:
      load  ROM0_HEADER
      type  ro;

   ROM0_8000:
      load  ROM0_LO
      type  ro;

   ROM0_9E00:
      load  ROM0_LO
      type  ro
      start $9E00;

   ROM0_E000:
      load  ROM0_HI
      type  ro;

   ROM0_VECTORS:
      load  ROM0_HI
      type  ro
      start $FFFA;

   ROM1_HEADER:
      load  ROM1_HEADER
      type  ro;

   ROM1_8000:
      load  ROM1_LO
      type  ro;

   ROM1_9E00:
      load  ROM1_LO
      type  ro
      start $9E00;

   ROM1_E000:
      load  ROM1_HI
      type  ro;

   ROM1_VECTORS:
      load  ROM1_HI
      type  ro
      start $FFFA;
}

