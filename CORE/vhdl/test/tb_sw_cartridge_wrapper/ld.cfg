# Start of memory section
MEMORY
{
   ROM0_LO:
      start $8000 - $0050
      size  $2050
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM0_HI:
      start $E000
      size  $2000
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM1_LO:
      start $8000 - $0010
      size  $2010
      type  ro
      fill  yes
      file  "snappy.crt";

   ROM1_HI:
      start $E000
      size  $2000
      type  ro
      fill  yes
      file  "snappy.crt";
}

SEGMENTS
{
   CODE0_LO:
      load  ROM0_LO
      type  ro;

   CODE0_HI:
      load  ROM0_HI
      type  ro;

   CODE1_LO:
      load  ROM1_LO
      type  ro;

   CODE1_HI:
      load  ROM1_HI
      type  ro;

   VECTORS0:
      load  ROM0_HI
      type  ro
      start $FFFA;

   VECTORS1:
      load  ROM1_HI
      type  ro
      start $FFFA;
}

