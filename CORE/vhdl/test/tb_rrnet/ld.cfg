# This is the layout for a CRT file with two 16k CHIPs
MEMORY
{
   ZP:
      start $0000
      size  $0100
      type  rw
      fill  no;

   RAM:
      start $0800
      size  $2000
      type  rw
      fill  no;

   ROM:
      start $F800
      size  $0800
      type  ro
      fill  yes
      file  "rrnet.bin";
}

SEGMENTS
{
   ZEROPAGE:
      load  ZP
      type  rw;

   DATA:
      load  RAM
      type  rw;

   BSS:
      load  RAM
      type  rw;

   # Place the HEADER segment at a fixed address
   HEADER:
      load  ROM
      type  ro
      start $F800;

   RODATA:
      load  ROM
      type  ro;

   CODE:
      load  ROM
      type  ro;

   VECTORS:
      load  ROM
      type  ro
      start $FFFA;
}

