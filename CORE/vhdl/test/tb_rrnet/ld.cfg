# This is the layout for a CRT file with two 16k CHIPs
MEMORY
{
   RAM:
      start $0000
      size  $0800
      type  rw
      fill  no;

   ROM:
      start $F800
      size  $0800
      type  ro
      fill  yes
      file  "rrnet.bin";
}

SEGMENTS
{
   ZEROPAGE:
      load  RAM
      type  rw;

   DATA:
      load  RAM
      type  rw;

   HEADER:
      load  ROM
      type  ro;

   RODATA:
      load  ROM
      type  ro;

   CODE:
      load  ROM
      type  ro;

   VECTORS:
      load  ROM
      type  ro
      start $FFFA;
}

